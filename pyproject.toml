[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fastfields-numpy"
version = "0.1.0"
description = "A friendly numpy interface over the fastfields.dlpack bindings."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "fastfields" }]
dependencies = [
    "fastfields-dlpack",
    "numpy",
]

[project.optional-dependencies]
test = ["pytest"]

# Ships only the ``fastfields.numpy`` subpackage; no ``fastfields/__init__.py``
# is created, keeping ``fastfields`` a PEP 420 native namespace package.
[tool.setuptools.packages.find]
include = ["fastfields.numpy*"]
namespaces = true
